    <div style="flex:1"><div style="font-size:19px;font-weight:800;letter-spacing:-.4px">5h 20m</div><div style="font-size:12px;color:#9C8B7E;font-weight:500">Travel</div></div><div style="flex:1"><div style="font-size:19px;font-weight:800;letter-spacing:-.4px">8 km</div><div style="font-size:12px;color:#9C8B7E;font-weight:500">Distance</div></div><div style="flex:1"><div style="font-size:19px;font-weight:800;letter-spacing:-.4px">4 stops</div><div style="font-size:12px;color:#9C8B7E;font-weight:500">Planned</div></div>

  </div>

  <!-- stop card with food photo -->

    <div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700">Old Manila lunch</div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:5px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9C8B7E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span style="font-size:12.5px;color:#9C8B7E;font-weight:500">1:00 PM</span><span style="width:1px;height:11px;background:#F1E7DC"></span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9C8B7E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg><span style="font-size:12.5px;color:#9C8B7E;font-weight:500">Intramuros, Manila</span></div>
    </div>
    <div style="width:32px;height:32px;border-radius:16px;background:#FF9E1B22;display:flex;align-items:center;justify-content:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FF9E1B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v7a2 2 0 0 0 4 0V3M6 3v18M15 3c-1.5 1-2 3-2 5s.5 3 2 3v10"/></svg></div>
  </div>

  <div style="flex:1"></div>

  <!-- bottom: floating white rounded card with inner rounded PRIMARY button -->
  <div style="margin:0 18px 26px;background:#FFFFFF;border-radius:28px;padding:14px 14px 14px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 30px rgba(20,20,20,.10)">
    <div style="flex:1"><div style="font-size:16px;font-weight:800">You're at the Museum</div><div style="font-size:12.5px;color:#9C8B7E;font-weight:500">Confirm to complete this stop.</div></div>
    <div style="height:52px;border-radius:26px;background:#FF6A3D;color:#fff;display:flex;align-items:center;gap:8px;padding:0 20px;font-size:15px;font-weight:700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> I'm here</div>
  </div>

  <!-- palette label -->
  <div style="position:absolute;top:14px;left:0;right:0;display:flex;justify-content:center"><div style="background:#241A14;color:#FFF6EE;font-size:11px;font-weight:800;letter-spacing:.5px;padding:5px 13px;border-radius:999px">TANGERINE WARMTH</div></div>
</div>

</body></html>
